# Configuración de igstories. Los secretos NO van aquí: usa variables de entorno
# (IG_ACCESS_TOKEN y, opcionalmente, TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).

timezone = "America/Santiago"      # los horarios de los slots se interpretan en esta zona
default_cooldown_days = 6          # días mínimos antes de repetir una misma historia
shuffle = true                     # desempate aleatorio (estable por día) entre imágenes igual de "nuevas"

[catalog]
# Toda imagen que aparezca en assets/ready (o subas a assets/source) entra sola al catálogo,
# sin editar content/stories.toml. Se publican primero las que nunca se han mostrado.
autodiscover = true
auto_tag = "libre"                 # etiqueta que reciben las imágenes descubiertas

[account]
ig_user_id = "28765457449731233"
login = "instagram"                # "instagram" (Business Login) | "facebook" (Facebook Login)
api_version = "v23.0"              # súbela cuando Meta retire versiones antiguas
poll_interval_s = 3
poll_timeout_s = 180
max_retries = 4

[hosting]
# static: assets/ready ya está publicado en esta URL base (tu sitio, GitHub Pages, CDN...).
# Con raw.githubusercontent.com (repo público): https://raw.githubusercontent.com/USUARIO/REPO/main/assets/ready
provider = "static"
base_url = "https://raw.githubusercontent.com/edisongom/tu-depilacion-historias/main/assets/ready"
preflight = true                   # HEAD previo: ¿responde 200 y es image/jpeg?

# s3 / Cloudflare R2 (alternativa; requiere pip install "igstories[s3]"):
# provider = "s3"
# bucket = "mi-bucket"
# prefix = "stories"
# endpoint_url = "https://<account>.r2.cloudflarestorage.com"
# public_base_url = "https://cdn.midominio.cl"

[image]
mode = "fit-blur"                  # fit-blur | fit-solid | cover (para originales que no son 9:16)
safe_top = 250                     # px que cubre la interfaz de Instagram arriba...
safe_bottom = 340                  # ...y abajo
background = "#fff6f9"
blur_radius = 40
quality = 90

[paths]
stories = "content/stories.toml"
source = "assets/source"
ready = "assets/ready"
history = "state/history.json"

# ---------------------------------------------------------------- slots (horarios diarios)
# Cada [[slots]] es una publicación diaria. Hay dos formas de fijar la hora:
#   time   = "12:30"                  hora fija
#   window = ["08:00", "11:00"]       hora aleatoria distinta cada día dentro de la ventana
# Con las ventanas de abajo, entre una historia y la siguiente pasan siempre entre 9 y 15 horas.
# Sin "tags" el slot elige entre TODAS las imágenes (las tuyas y las tarjetas de marca).
# Para filtrar: tags = ["libre"] (solo tus imágenes) o tags_by_weekday (ver ejemplo al final).
[[slots]]
name = "manana"
window = ["08:00", "11:00"]
grace_minutes = 240                # si el cron se atrasa, publica hasta 4 h después
max_attempts = 3

[[slots]]
name = "noche"
window = ["20:00", "23:00"]
grace_minutes = 240
max_attempts = 3

# Ejemplo: contenido distinto según el día de la semana
# [slots.tags_by_weekday]
# mon = ["precios"]
# tue = ["mitos"]
# wed = ["cuidados"]
# thu = ["precios"]
# fri = ["info"]
# sat = ["mitos"]
# sun = ["info"]

# ---------------------------------------------------------------------- overrides (excepciones)
# [[overrides]]
# date = 2026-12-24
# story = "navidad"        # fuerza una historia concreta ese día
#
# [[overrides]]
# date = 2026-12-25
# skip = true              # no publicar ese día
