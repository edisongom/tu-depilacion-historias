name: refresh-token
on:
  schedule:
    - cron: "17 6 1,15 * *"   # días 1 y 15: el token dura 60 días, así nunca vence
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Renovar token y actualizar el secreto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PAT con permiso de escribir secretos del repo (Actions secrets: write)
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: igstories token-refresh --gh-secret IG_ACCESS_TOKEN --gh-repo "${{ github.repository }}"
