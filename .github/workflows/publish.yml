name: publish-stories
on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (UTC); la lógica "due" absorbe retrasos y cambios de hora
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin publicar"
        type: boolean
        default: false

concurrency:
  group: publish-stories
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Publicar historias pendientes
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: igstories publish --due ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "igstories-bot"
          git config user.email "igstories-bot@users.noreply.github.com"
          git add state/history.json
          if ! git diff --cached --quiet; then
            git commit -m "state: actualizar historial [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
