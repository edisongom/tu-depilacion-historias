[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igstories"
version = "0.1.0"
description = "Publicador programado de historias de Instagram (Instagram Graph API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
    "tzdata>=2024.1",            # Windows no trae base de zonas horarias
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]          # hosting S3 / Cloudflare R2
dev = ["ruff>=0.5"]

[project.scripts]
igstories = "igstories.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
"tests/*" = ["E501", "I001"]
